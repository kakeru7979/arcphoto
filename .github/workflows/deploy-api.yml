name: Deploy Azure Function Proxy

on:
  push:
    branches: [main]
    paths: ['api/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Deploy function to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true

      - name: Set application settings
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          app-settings-json: |
            [
              {
                "name": "AZURE_FACE_API_KEY",
                "value": "${{ secrets.AZURE_FACE_API_KEY }}",
                "slotSetting": false
              },
              {
                "name": "AZURE_FACE_ENDPOINT",
                "value": "https://arcphoto-face.cognitiveservices.azure.com/",
                "slotSetting": false
              }
            ]
